syntax = "proto3";
package ethwei.ethwei.v1;

import "amino/amino.proto";
import "ethwei/ethwei/v1/params.proto";
import "gogoproto/gogo.proto";

option go_package = "ethwei/x/ethwei/types";

// GenesisState defines the ethwei module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
